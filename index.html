        var decoded = l.search.slice(1).split('&').map(function(s) {

        });

          console.log("✅ SPA-Restore: Final redirect URL:", targetUrl);
          
          window.history.replaceState(null, null, targetUrl);
        } else {
          console.log("ℹ️ SPA-Restore: At root, no restoration needed.");
        }
      } else {
